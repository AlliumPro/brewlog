name: CI

# Pull requests only. A push to main is covered by deploy.yml, which runs the same gate before
# it builds anything — running both would test the same commit twice.
on:
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # setup-node ships npm 10 with Node 22; the lockfile is written by npm 11, which npm 10
      # refuses to read in `ci` mode. Same pin as the Dockerfile.
      - run: npm install -g npm@11.6.2

      # ci, not install: the lockfile is the contract, and a drifting tree is a failure.
      - run: npm ci

      - name: Verify
        run: npm run verify

      # Scoped to what actually ships. The dev-only advisories and the reasoning behind this
      # scope are recorded in docs/SECURITY.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check that openapi.json matches the code
        run: |
          npm run openapi:export
          git diff --exit-code apps/api/openapi.json \
            || (echo "::error::openapi.json is stale. Run 'npm run openapi:export' and commit the result." && exit 1)

      - name: Check that the generated client types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code apps/web/src/shared/api/generated.ts \
            || (echo "::error::Generated API types are stale. Run 'npm run gen:api' and commit the result." && exit 1)

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built but not pushed: a pull request proves the image still assembles without
      # publishing anything.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: brewlog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: brewlog:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # A built image proves it compiles, not that it runs. These are different failures:
      # a corrupted secret, a missing native binding or a misconfigured static root all
      # produce an image that builds perfectly and serves nothing.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Run the image and smoke test it
        env:
          SMOKE_PASSWORD: smoke-test-only-passphrase
          # A throwaway container, so registering into it costs nothing and covers the
          # path unit tests cannot: real environment, real migration, real cookies.
          SMOKE_ALLOW_REGISTER: '1'
        run: |
          HASH=$(docker run --rm -e P="$SMOKE_PASSWORD" brewlog:ci \
            node -e "import('@node-rs/argon2').then(a=>a.hash(process.env.P,{memoryCost:19456,timeCost:2,parallelism:1})).then(h=>console.log(h))")
          docker run -d --name smoke -p 3000:3000 \
            -e AUTH_PASSWORD_HASH="$HASH" \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e SWAGGER_USER=ci -e SWAGGER_PASSWORD=ci \
            brewlog:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/ready >/dev/null 2>&1 && break
            sleep 2
          done
          SWAGGER_USER=ci SWAGGER_PASSWORD=ci npm run smoke
          docker logs smoke
          docker rm -f smoke
