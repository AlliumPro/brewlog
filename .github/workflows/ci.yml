name: CI

# Runs on pull requests and on main. Vercel builds and deploys on its own from the same
# pushes; this workflow is the gate that says whether the code deserved it. Turn on branch
# protection and require this check, so a red run blocks the merge instead of just
# annotating it.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # setup-node ships npm 10 with Node 22; the lockfile is written by npm 11, which npm 10
      # refuses to read in `ci` mode.
      - run: npm install -g npm@11.6.2

      # ci, not install: the lockfile is the contract, and a drifting tree is a failure.
      - run: npm ci

      - name: Verify
        run: npm run verify

      # Scoped to what actually ships. The dev-only advisories and the reasoning behind this
      # scope are recorded in docs/SECURITY.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check that openapi.json matches the code
        run: |
          npm run openapi:export
          git diff --exit-code apps/api/openapi.json \
            || (echo "::error::openapi.json is stale. Run 'npm run openapi:export' and commit the result." && exit 1)

      - name: Check that the generated client types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code apps/web/src/shared/api/generated.ts \
            || (echo "::error::Generated API types are stale. Run 'npm run gen:api' and commit the result." && exit 1)

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.6.2

      - run: npm ci

      - run: npm run build:api

      # verify proves the code; this proves the built artefact. The compiled API starts on
      # real Postgres semantics (PGlite), native modules load on Linux, migrations apply from
      # the shipped folder, and a photo survives the round trip through sharp and the database.
      # What it cannot cover is Vercel itself — routing, headers and the function runtime are
      # checked against the live deployment, see docs/RUNBOOK.md.
      - name: Start the API and smoke test it
        env:
          SWAGGER_USER: ci
          SWAGGER_PASSWORD: ci
        run: |
          NODE_ENV=test DATABASE_URL=memory:// SESSION_SECRET="$(openssl rand -hex 32)" \
            SWAGGER_USER=ci SWAGGER_PASSWORD=ci PORT=3000 \
            node apps/api/dist/index.js > api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/ready >/dev/null 2>&1 && break
            sleep 2
          done
          SMOKE_API_ONLY=1 SMOKE_ALLOW_REGISTER=1 npm run smoke || { cat api.log; exit 1; }
