# Publishes the image to GHCR on a version tag.
#
# The SSH deploy step belongs here too, and is deliberately absent: there is no server yet
# (phases 7 and 8 are out of scope for this version). Adding it later means one more job that
# pulls this tag on the host — the image published here is already the artefact it would use.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same pin as the Dockerfile and ci.yml: npm 10 cannot read this lockfile.
      - run: npm install -g npm@11.6.2

      - run: npm ci

      # A tag must never publish something that does not pass the gate.
      - run: npm run verify

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
