# Production-shaped stack. Runs locally today; the only thing phase 7 adds is a reverse proxy
# with TLS in front of it.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: brewlog:local
    restart: unless-stopped
    # Bound to the loopback interface: without TLS in front, this must not listen on a public
    # address. Phase 7 replaces this with a proxy that terminates HTTPS.
    ports:
      - '127.0.0.1:3000:3000'
    # env_file rather than `environment: KEY: ${KEY}`, and this was found by running it: compose
    # interpolates `$` inside interpolated values, and an argon2 hash is `$argon2id$v=19$m=…`.
    # The hash arrived mangled and every login failed, while the health check stayed green
    # because /ready knows nothing about passwords. env_file passes values through literally.
    #
    # The app validates these itself and refuses to start when one is missing, so nothing is
    # lost by dropping the `:?` guards that used to live here.
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: /data/brewlog.db
      UPLOAD_DIR: /data/uploads
      STATIC_DIR: /app/public
    volumes:
      - brewlog-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  # The database and the photos live here. This is the only thing worth backing up.
  brewlog-data:
