<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Private journal behind a password gate: never index it. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Both schemes are supported; form controls and scrollbars follow the active one. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Content is set by theme.js before first paint, then kept in sync by useTheme. -->
    <meta name="theme-color" content="#fbf9fc" />
    <!-- iOS ignores the manifest icon for the home screen and uses this one. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- black-translucent lets the page run under the status bar; the safe-area insets in
         tokens.css are what keep content out from under the notch or Dynamic Island. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BrewLog" />
    <title>BrewLog</title>
    <!-- Blocking on purpose: it sets the theme before first paint. See public/theme.js. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
